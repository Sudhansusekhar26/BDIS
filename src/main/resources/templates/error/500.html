<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('500 Internal Server Error')}"></head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="py-5">
    <div class="container text-center py-5">
        <div class="d-inline-flex align-items-center justify-content-center bg-danger bg-opacity-10 text-danger p-4 rounded-circle mb-3">
            <i class="bi bi-cpu-fill fs-1"></i>
        </div>
        <h1 class="fw-black text-danger display-4">500</h1>
        <h3 class="fw-bold text-slate-800 mb-2">Internal Server Encountered an Issue</h3>
        <p class="text-muted col-md-6 mx-auto mb-4" th:text="${errorMessage != null ? errorMessage : 'An unexpected exception occurred while processing this emergency blood requisition. Our technical team has been notified.'}">
            Server error.
        </p>
        <a th:href="@{/}" class="btn btn-danger px-4 fw-bold">
            <i class="bi bi-house-door-fill me-1"></i> Return Home
        </a>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
