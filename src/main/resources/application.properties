# ===================================================================
# Blood Donation Management and Inventory Control System (BDIS)
# Application Configuration
# ===================================================================

spring.application.name=bdis-system
server.port=8080

# Default DataSource: In-memory H2 with MySQL compatibility mode for instant execution
# To use MySQL in production: run with --spring.profiles.active=mysql or set system property
spring.datasource.url=jdbc:h2:mem:bdis_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (for inspection during development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Logging Configuration
logging.level.com.bdis=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
