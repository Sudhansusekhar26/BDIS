<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Volunteer Blood Donor Pledge')}"></head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="py-4">
    <div class="container">
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card bdis-card border-0 shadow-sm p-4 mb-4">
                    <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
                        <div class="bg-success text-white p-3 rounded-circle fs-3"><i class="bi bi-heart-pulse-fill"></i></div>
                        <div>
                            <h4 class="fw-bold mb-0">Volunteer Blood Donation Pledge</h4>
                            <p class="text-muted small mb-0">Schedule your next voluntary blood donation appointment at a verified hospital.</p>
                        </div>
                    </div>

                    <form th:action="@{/user/pledge}" method="post" class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Preferred Hospital / Blood Center</label>
                            <select name="hospitalId" class="form-select">
                                <option value="">-- Any Nearby Verified Hospital --</option>
                                <option th:each="h : ${hospitals}" th:value="${h.id}" th:text="${h.hospitalName} + ' (' + ${h.district.name} + ')'">Apollo Hospital</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Pledged Donation Date <span class="text-danger">*</span></label>
                            <input type="date" name="pledgedDate" class="form-control" th:min="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" required>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold small">Notes / Motivation (Optional)</label>
                            <textarea name="notes" class="form-control" rows="2" placeholder="e.g. In memory of / Birthday donation / Regular 90-day cycle..."></textarea>
                        </div>

                        <div class="col-12 pt-2">
                            <button type="submit" class="btn btn-success w-100 py-2 fw-bold">
                                <i class="bi bi-calendar-heart-fill me-1"></i> Confirm Donor Pledge
                            </button>
                        </div>
                    </form>
                </div>

                <!-- My Past Pledges History -->
                <div class="card bdis-card border-0 shadow-sm p-4">
                    <h5 class="fw-bold mb-3"><i class="bi bi-clock-history me-2 text-success"></i> My Donation Pledges History</h5>
                    <div class="table-responsive" th:if="${!myPledges.empty}">
                        <table class="table table-sm table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>Pledged Date</th>
                                    <th>Hospital Blood Center</th>
                                    <th>Status</th>
                                    <th>Units</th>
                                    <th>Notes</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="p : ${myPledges}">
                                    <td class="fw-bold" th:text="${#temporals.format(p.pledgedDate, 'dd MMM yyyy')}">05 Oct 2026</td>
                                    <td th:text="${p.hospital != null ? p.hospital.hospitalName : 'Any Center'}">Apollo Center</td>
                                    <td><span class="badge bg-success" th:text="${p.status}">PLEDGED</span></td>
                                    <td th:text="${p.unitsDonated} + ' Unit'">1 Unit</td>
                                    <td class="small text-muted" th:text="${p.notes}">Notes</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div th:if="${myPledges.empty}" class="text-muted small">No past pledges found.</div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
