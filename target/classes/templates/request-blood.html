<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Submit Urgent Blood Requisition')}"></head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card bdis-card shadow-lg border-0 p-4">
                    <div class="d-flex align-items-center justify-content-between mb-4 border-bottom pb-3">
                        <div class="d-flex align-items-center gap-3">
                            <div class="bg-danger text-white p-3 rounded-circle fs-3"><i class="bi bi-heart-pulse-fill"></i></div>
                            <div>
                                <h3 class="fw-bold text-slate-800 mb-0">Emergency Blood Requisition</h3>
                                <p class="text-muted small mb-0">Place an immediate dispatch order to a verified hospital blood bank.</p>
                            </div>
                        </div>
                        <span class="badge bg-danger bg-opacity-10 text-danger border border-danger px-3 py-2 fw-bold">
                            <i class="bi bi-lightning-charge-fill me-1"></i> Fast-Track Dispatch
                        </span>
                    </div>

                    <div th:replace="~{fragments/alerts :: alerts}"></div>

                    <form th:action="@{/user/request-blood}" th:object="${requestDto}" method="post" class="row g-3">
                        <!-- Target Hospital Selection -->
                        <div class="col-12">
                            <label class="form-label fw-semibold small">Select Target Hospital / Blood Bank <span class="text-danger">*</span></label>
                            <select th:field="*{hospitalId}" class="form-select form-select-lg" required>
                                <option value="">-- Choose Verified Hospital Blood Bank --</option>
                                <option th:each="h : ${hospitals}"
                                        th:value="${h.id}"
                                        th:text="${h.hospitalName} + ' (' + ${h.district.name} + ', ' + ${h.state.code} + ') - Helpline: ' + ${h.emergencyHelpline}">
                                    Apollo Hospital (Khordha, OD)
                                </option>
                            </select>
                            <div class="text-danger small" th:if="${#fields.hasErrors('hospitalId')}" th:errors="*{hospitalId}"></div>
                        </div>

                        <!-- Patient Name -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Patient Full Name <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{patientName}" class="form-control" placeholder="e.g. Sunita Sharma" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('patientName')}" th:errors="*{patientName}"></div>
                        </div>

                        <!-- Admitted Hospital -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Hospital Where Patient Is Admitted <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{admittedHospitalName}" class="form-control" placeholder="e.g. Kalinga Hospital, Ward 4 ICU" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('admittedHospitalName')}" th:errors="*{admittedHospitalName}"></div>
                        </div>

                        <!-- Blood Group -->
                        <div class="col-md-4">
                            <label class="form-label fw-semibold small">Required Blood Group <span class="text-danger">*</span></label>
                            <select th:field="*{bloodGroup}" class="form-select" required>
                                <option value="">-- Select Group --</option>
                                <option th:each="bg : ${bloodGroups}" th:value="${bg}" th:text="${bg.label} + ' (' + ${bg.name()} + ')'">O+</option>
                            </select>
                            <div class="text-danger small" th:if="${#fields.hasErrors('bloodGroup')}" th:errors="*{bloodGroup}"></div>
                        </div>

                        <!-- Component Type -->
                        <div class="col-md-4">
                            <label class="form-label fw-semibold small">Blood Component <span class="text-danger">*</span></label>
                            <select th:field="*{componentType}" class="form-select" required>
                                <option th:each="comp : ${componentTypes}" th:value="${comp}" th:text="${comp.displayName}">Whole Blood</option>
                            </select>
                        </div>

                        <!-- Units Requested -->
                        <div class="col-md-4">
                            <label class="form-label fw-semibold small">Units Required <span class="text-danger">*</span></label>
                            <input type="number" th:field="*{unitsRequested}" class="form-control" min="1" max="10" placeholder="1" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('unitsRequested')}" th:errors="*{unitsRequested}"></div>
                        </div>

                        <!-- Urgency Level -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Urgency Priority Level <span class="text-danger">*</span></label>
                            <select th:field="*{urgencyLevel}" class="form-select" required>
                                <option th:each="urg : ${urgencyLevels}"
                                        th:value="${urg}"
                                        th:text="${urg.label} + ' (' + ${urg.etaDescription} + ')'">
                                    Normal
                                </option>
                            </select>
                        </div>

                        <!-- Delivery Address -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Hospital Delivery Ward / Receiving Desk <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{deliveryAddress}" class="form-control" placeholder="e.g. ICU Ward 3, Kalinga Hospital, Bhubaneswar" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('deliveryAddress')}" th:errors="*{deliveryAddress}"></div>
                        </div>

                        <!-- Doctor Prescription Notes -->
                        <div class="col-12">
                            <label class="form-label fw-semibold small">Attending Doctor Notes / Clinical Requisition Reason</label>
                            <textarea th:field="*{prescriptionNotes}" class="form-control" rows="3" placeholder="Prescription reference number, doctor name, hemoglobin/platelet count, surgery type..."></textarea>
                        </div>

                        <div class="col-12 pt-3">
                            <button type="submit" class="btn btn-bdis-emergency w-100 py-3 fs-5 fw-bold">
                                <i class="bi bi-send-check-fill me-2"></i> Submit Urgent Blood Request Now
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
